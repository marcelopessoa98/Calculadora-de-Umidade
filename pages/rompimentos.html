<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Rompimentos - ConcreFuji</title>
    <meta name="theme-color" content="#c8101e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SGI ConcreFuji" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/assets/css/tailwind.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      * { box-sizing: border-box; }
      body { -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
      button, a { touch-action: manipulation; }
      .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
      .calendar-day { min-height: 44px; }
      @media (min-width: 390px) { .calendar-day { min-height: 48px; } }
    </style>
  </head>
  <body class="min-h-screen bg-slate-100 p-4 pb-24 font-sans text-slate-900">
    <div class="mx-auto w-full max-w-3xl">
      <a
        href="../index.html"
        class="mb-5 inline-flex min-h-11 items-center text-slate-500 transition-colors hover:text-red-600"
      >
        <i class="fa-solid fa-arrow-left mr-2"></i>
        Voltar ao Menu
      </a>

      <header class="rounded-2xl border-b-4 border-red-600 bg-slate-950 p-5 text-white">
        <div class="flex items-center gap-4">
          <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-red-600">
            <i class="fa-solid fa-calendar-check text-xl"></i>
          </div>
          <div class="min-w-0">
            <p class="text-[10px] font-black uppercase tracking-[0.24em] text-slate-400">SGI ConcreFuji</p>
            <h1 class="text-2xl font-black tracking-tight">Rompimentos</h1>
          </div>
        </div>
      </header>

      <section id="selecaoFuncionario" class="mt-5">
        <div class="mb-4">
          <h2 class="text-lg font-black text-slate-900">Selecione o funcionário</h2>
          <p class="text-sm text-slate-500">Consulte os corpos de prova programados.</p>
        </div>
        <div id="funcionariosLista" class="grid gap-3 sm:grid-cols-2" aria-live="polite">
          <div class="rounded-2xl border border-slate-200 bg-white p-5 text-center text-sm font-bold text-slate-400">
            Carregando rompimentos...
          </div>
        </div>
      </section>

      <section id="painelFuncionario" class="hidden mt-5">
        <button
          id="btnTrocarFuncionario"
          type="button"
          class="mb-3 inline-flex min-h-11 items-center gap-2 rounded-xl bg-white px-4 text-sm font-black text-slate-600 shadow-sm"
        >
          <i class="fa-solid fa-users"></i>
          Trocar funcionário
        </button>

        <article class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
          <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Funcionário</p>
          <h2 id="funcionarioNome" class="break-words text-xl font-black text-slate-900"></h2>
          <p id="funcionarioObra" class="break-words text-sm font-bold text-red-600"></p>
        </article>

        <section
          id="avisoRompimentosAtrasados"
          class="relative mt-4 hidden rounded-2xl border border-amber-300 bg-amber-50 p-5 pr-12 shadow-sm"
          hidden
          role="alert"
          aria-live="assertive"
        >
          <button
            id="btnFecharAvisoAtrasos"
            type="button"
            class="absolute right-2 top-2 flex h-10 w-10 items-center justify-center rounded-xl text-amber-800 transition hover:bg-amber-100"
            aria-label="Fechar aviso"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
          <div class="flex items-start gap-3">
            <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-amber-400 text-amber-950">
              <i class="fa-solid fa-triangle-exclamation"></i>
            </span>
            <div class="min-w-0">
              <h3 class="font-black text-amber-950">Aviso de rompimentos em atraso</h3>
              <p id="avisoRompimentosTexto" class="mt-1 break-words text-sm font-bold leading-6 text-amber-900"></p>
            </div>
          </div>
        </section>

        <section id="centralNotificacoes" class="mt-4 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
          <button
            id="btnAlternarNotificacoes"
            type="button"
            class="flex min-h-14 w-full items-center gap-3 px-4 text-left"
            aria-expanded="false"
            aria-controls="painelNotificacoes"
          >
            <span class="relative flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-slate-100 text-slate-700">
              <i class="fa-solid fa-bell"></i>
              <span id="contadorNotificacoes" class="absolute -right-1 -top-1 hidden min-w-5 rounded-full bg-red-600 px-1 text-center text-[10px] font-black leading-5 text-white" hidden></span>
            </span>
            <span class="min-w-0 flex-1">
              <strong class="block text-sm font-black text-slate-900">Notificações</strong>
              <span id="resumoNotificacoes" class="block text-xs font-bold text-slate-500">Verificando pendências...</span>
            </span>
            <i id="iconeNotificacoes" class="fa-solid fa-chevron-down text-slate-400 transition-transform"></i>
          </button>
          <div id="painelNotificacoes" class="hidden border-t border-slate-100 p-4" aria-live="polite" hidden>
            <p class="text-sm font-bold text-slate-500">Verificando pendências...</p>
          </div>
        </section>

        <article class="mt-4 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
          <div class="flex items-center justify-between gap-2 border-b border-slate-100 p-3">
            <button id="mesAnterior" type="button" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-slate-100 text-slate-700" aria-label="Mês anterior">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <h3 id="tituloMes" class="min-w-0 text-center text-base font-black capitalize text-slate-900"></h3>
            <button id="proximoMes" type="button" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-slate-100 text-slate-700" aria-label="Próximo mês">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>
          <div class="calendar-grid px-2 pt-3 text-center text-[10px] font-black uppercase text-slate-400" aria-hidden="true">
            <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
          </div>
          <div id="calendario" class="calendar-grid gap-1 p-2" role="grid" aria-label="Calendário mensal"></div>
        </article>

        <section class="mt-4" aria-live="polite">
          <div class="mb-3">
            <p id="diaSemana" class="text-[10px] font-black uppercase tracking-[0.2em] text-red-600"></p>
            <h3 id="dataSelecionada" class="text-2xl font-black text-slate-900"></h3>
          </div>
          <div id="estadoRompimentos" class="hidden rounded-2xl border border-slate-200 bg-white p-5 text-center text-sm font-bold text-slate-500"></div>
          <div id="rompimentosLista" class="grid gap-3"></div>
        </section>
      </section>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/rompimentos.js?v=20261026-4"></script>
    <script src="/js/pwa.js"></script>
  </body>
</html>

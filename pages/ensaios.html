<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ensaios - ConcreFuji</title>
    <meta name="theme-color" content="#c8101e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SGI ConcreFuji" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
      body { -webkit-tap-highlight-color: transparent; }
      .menu-card { transition: transform .2s ease, box-shadow .2s ease; }
      .menu-card:hover { transform: translateY(-1px); box-shadow: 0 14px 28px rgba(15, 23, 42, .08); }
      .menu-card:active { transform: scale(.98); }
    </style>
  </head>
  <body class="min-h-screen bg-slate-100 p-4 pb-10 font-sans text-slate-900">
    <div class="mx-auto max-w-2xl">
      <a href="../index.html" class="group mb-5 inline-flex items-center text-slate-500 transition-colors hover:text-red-600">
        <i class="fa-solid fa-arrow-left mr-2 transition-transform group-hover:-translate-x-1"></i>
        Voltar ao Menu
      </a>

      <header class="rounded-2xl border-b-4 border-red-600 bg-slate-950 p-5 text-white shadow-sm sm:p-6">
        <div class="flex items-center gap-4">
          <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-red-600">
            <i class="fa-solid fa-flask text-xl"></i>
          </div>
          <div>
            <p class="text-[10px] font-black uppercase tracking-[.24em] text-slate-400">SGI ConcreFuji</p>
            <h1 class="text-2xl font-black tracking-tight">Ensaios</h1>
            <p class="mt-1 text-sm text-slate-300">Ferramentas e cálculos técnicos</p>
          </div>
        </div>
      </header>

      <main class="mt-5 grid gap-4 sm:grid-cols-2">
        <a href="umidade.html" class="menu-card flex min-h-40 flex-col rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
          <span class="flex h-12 w-12 items-center justify-center rounded-xl bg-red-50 text-red-600">
            <i class="fa-solid fa-droplet text-xl"></i>
          </span>
          <div class="mt-5 flex items-end gap-3">
            <div class="min-w-0 flex-1">
              <h2 class="font-black text-slate-900">Umidade de Areia</h2>
              <p class="mt-1 text-xs text-slate-500">Cálculo do teor de umidade em massa</p>
            </div>
            <i class="fa-solid fa-chevron-right text-sm text-slate-300"></i>
          </div>
        </a>

        <a href="conversao.html" class="menu-card flex min-h-40 flex-col rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
          <span class="flex h-12 w-12 items-center justify-center rounded-xl bg-cyan-50 text-cyan-700">
            <i class="fa-solid fa-arrows-rotate text-xl"></i>
          </span>
          <div class="mt-5 flex items-end gap-3">
            <div class="min-w-0 flex-1">
              <h2 class="font-black text-slate-900">Conversor Técnico</h2>
              <p class="mt-1 text-xs text-slate-500">Conversões entre Tf, kN e MPa</p>
            </div>
            <i class="fa-solid fa-chevron-right text-sm text-slate-300"></i>
          </div>
        </a>
      </main>
    </div>
    <script src="/js/pwa.js"></script>
  </body>
</html>

<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Passagens Extras - ConcreFuji</title>
    <meta name="theme-color" content="#c8101e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
      * { box-sizing: border-box; }
      body { -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
      button, a { touch-action: manipulation; }
      input, select { font-size: 16px !important; }
      .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
      .calendar-day { min-height: 44px; }
      @media (min-width: 390px) { .calendar-day { min-height: 48px; } }
    </style>
  </head>
  <body class="min-h-screen bg-slate-100 p-4 pb-24 font-sans text-slate-900">
    <div class="mx-auto w-full max-w-3xl">
      <a href="../index.html" class="mb-5 inline-flex min-h-11 items-center text-slate-500 transition-colors hover:text-red-600">
        <i class="fa-solid fa-arrow-left mr-2"></i>Voltar ao Menu
      </a>

      <header class="rounded-2xl border-b-4 border-red-600 bg-slate-950 p-5 text-white">
        <div class="flex items-center gap-4">
          <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-red-600"><i class="fa-solid fa-route text-xl"></i></div>
          <div class="min-w-0">
            <p class="text-[10px] font-black uppercase tracking-[0.24em] text-slate-400">SGI ConcreFuji</p>
            <h1 class="text-2xl font-black tracking-tight">Passagens Extras</h1>
          </div>
        </div>
      </header>

      <section id="selecaoFuncionario" class="mt-5">
        <div class="mb-4">
          <h2 class="text-lg font-black">Selecione o funcionário</h2>
          <p class="text-sm text-slate-500">Registre deslocamentos extras entre obras.</p>
        </div>
        <div id="funcionariosLista" class="grid gap-3 sm:grid-cols-2" aria-live="polite">
          <div class="rounded-2xl border border-slate-200 bg-white p-5 text-center text-sm font-bold text-slate-400">Carregando funcionários...</div>
        </div>
      </section>

      <section id="painelFuncionario" class="mt-5 hidden">
        <button id="btnTrocarFuncionario" type="button" class="mb-3 inline-flex min-h-11 items-center gap-2 rounded-xl bg-white px-4 text-sm font-black text-slate-600 shadow-sm">
          <i class="fa-solid fa-users"></i>Trocar funcionário
        </button>

        <article class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
          <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Funcionário</p>
          <h2 id="funcionarioNome" class="break-words text-xl font-black"></h2>
          <p id="funcionarioObra" class="break-words text-sm font-bold text-red-600"></p>
        </article>

        <article class="mt-4 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
          <div class="flex items-center justify-between gap-2 border-b border-slate-100 p-3">
            <button id="mesAnterior" type="button" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-slate-100 text-slate-700" aria-label="Mês anterior"><i class="fa-solid fa-chevron-left"></i></button>
            <h3 id="tituloMes" class="min-w-0 text-center text-base font-black capitalize"></h3>
            <button id="proximoMes" type="button" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-slate-100 text-slate-700" aria-label="Próximo mês"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
          <div class="calendar-grid px-2 pt-3 text-center text-[10px] font-black uppercase text-slate-400" aria-hidden="true">
            <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
          </div>
          <div id="calendario" class="calendar-grid gap-1 p-2" role="grid" aria-label="Calendário mensal"></div>
        </article>

        <section class="mt-4">
          <div class="mb-3">
            <p id="diaSemana" class="text-[10px] font-black uppercase tracking-[0.2em] text-red-600"></p>
            <h3 id="dataSelecionada" class="text-2xl font-black"></h3>
          </div>
          <form id="formPassagem" class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
            <div class="grid gap-3 sm:grid-cols-2">
              <label class="block"><span class="mb-1 ml-1 block text-[10px] font-black uppercase text-slate-400">Estava na obra</span><select id="obraOrigem" required class="w-full rounded-xl border border-slate-200 bg-slate-50 p-3 font-bold outline-none focus:ring-2 focus:ring-red-500"></select></label>
              <label class="block"><span class="mb-1 ml-1 block text-[10px] font-black uppercase text-slate-400">Foi para a obra</span><select id="obraDestino" required class="w-full rounded-xl border border-slate-200 bg-slate-50 p-3 font-bold outline-none focus:ring-2 focus:ring-red-500"></select></label>
            </div>
            <p id="erroFormulario" class="mt-3 hidden rounded-xl bg-red-50 p-3 text-sm font-bold text-red-700" role="alert"></p>
            <button id="btnSalvarPassagem" type="submit" class="mt-4 w-full rounded-xl bg-red-600 py-4 text-xs font-black uppercase tracking-widest text-white shadow-sm transition active:scale-[.98]"><i class="fa-solid fa-plus mr-2"></i>Adicionar passagem extra</button>
          </form>
        </section>

        <section class="mt-5" aria-live="polite">
          <div class="mb-3 flex items-end justify-between gap-3">
            <div><p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Histórico do mês</p><h3 class="text-xl font-black">Passagens cadastradas</h3></div>
            <div class="rounded-xl bg-slate-950 px-4 py-2 text-center text-white"><strong id="totalMes" class="block text-xl font-black">0</strong><span class="text-[9px] font-black uppercase tracking-wider text-slate-400">Total</span></div>
          </div>
          <div id="estadoPassagens" class="rounded-2xl border border-slate-200 bg-white p-5 text-center text-sm font-bold text-slate-500">Carregando passagens...</div>
          <div id="passagensLista" class="grid gap-3"></div>
        </section>
      </section>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/passagens-extras.js"></script>
    <script src="/js/pwa.js"></script>
  </body>
</html>
